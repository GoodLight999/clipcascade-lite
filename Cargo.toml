[package]
name = "clipcascade-lite"
version = "0.1.1"
edition = "2024"
description = "Lightweight Rust/Win32 Windows client compatible with ClipCascade (P2P & P2S)"
license = "GPL-3.0-only"
repository = "https://github.com/GoodLight999/clipcascade-lite"
readme = "README.md"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
native-tls = "0.2"
pbkdf2 = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "cookies", "json"] }
scraper = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
uuid = { version = "1", features = ["v4"] }
webrtc = "0.14"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
clipboard-win = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
